  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:title" content="Free GATE Practice Test | GyanManthan Classes">
  <meta property="og:description" content="Attempt this free GATE ECE practice test with timer, solutions & real exam experience.">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/blog.css">
  <link rel="stylesheet" href="/test-file/test.css">
  <link rel="stylesheet" href="/assets/katex/katex.min.css">
  <script defer src="/assets/katex/katex.min.js"></script>
  <script defer src="/assets/katex/auto-render.min.js"></script>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q05YRFGQJR"></script>

</head>
<script>
  if (localStorage.getItem("isLoggedIn") !== "true") {
    window.location.href = "login.html";
  }
</script>
<body>

  <!-- 1. HEADER MODULE CONTAINER (lowercase ID) -->
  <div id="header"></div>

  <!-- Timer Box -->
  <div id="timer">
    <div>⏳ 00:00</div>
  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <div id="instructionsBox" style="padding-top:140px !important; max-width:800px;margin:40px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.1);">
      <h2 style="text-align:center;">📘 Test Instructions</h2>
      <div id="attemptStatusBox"></div>
      <div id="instructionsContent"></div>
      <div id="leaderboardBox" style="margin-top:30px; border-top:2px dashed #eee; padding-top:20px;">
        <h3 style="text-align:center; color:#0b1a33; margin-bottom:15px;">🏆 Test Leaderboard</h3>
        <div id="leaderboardTableContainer">
          <p style="text-align:center; color:#666;">Loading leaderboard...</p>
        </div>
      </div>
    </div>

    <!-- EXAM SECTION -->
    <div id="examApp" style="display: none;">
      <div style="display:flex;gap:10px;padding:10px; align-items: flex-start;">
        <div id="palette" style="width:120px;"></div>
        <div style="flex:1;">
          <div id="questionBox"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/blog.js"></script>
  <!-- Agar header load karne ki global script hai toh use yahan load karein -->
  <script src="/script.js"></script> 
  <script type="module" src="./check-test-signal.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof renderMathInElement !== "undefined") {
        renderMathInElement(document.body, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ]
        });
      }
    });
  </script>
</body>
</html>
